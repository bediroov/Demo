spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/nakhdb
    username: pass
    password: 1212

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false #DB-ile is bitdikde session baglanir
    properties:
      hibernate:
        jdbc:
          lob:
            non_contextual_creation=true
        show_sql: true
        dialect:  org.hibernate.dialect.PostgreSQLDialect

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 20MB


logging:
  level:
    org.springframework: info
    org.hibernate: info

server:
  port: 8088
