services:
  db:
    image: postgres:16-alpine
    container_name: my_postgres
    environment:
      POSTGRES_USER: pass
      POSTGRES_PASSWORD: 1212
      POSTGRES_DB: nakhdb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - my_network

volumes:
  postgres_data:

networks:
  my_network:

